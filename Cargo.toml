[package]
name = "rushdown-d2"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Draw the d2 code blocks of a rushdown document as inline SVG."
license = "MIT"
repository = "https://github.com/NicolasChagnet/rushdown-d2"
keywords = ["d2", "diagram", "markdown", "svg"]
categories = ["text-processing", "visualization"]
documentation = "https://docs.rs/rushdown-d2"

[dependencies]
rushdown = "0.18.0"
